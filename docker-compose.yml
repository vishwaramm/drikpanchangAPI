services:
  drikpanchang-api:
    build: .
    container_name: drikpanchang-api
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "5050"]
    restart: unless-stopped
    ports:
      - "5000:5050"
    environment:
      HOST: "0.0.0.0"
      PORT: "5050"
      DEBUG: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
